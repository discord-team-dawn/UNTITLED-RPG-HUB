<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제목 없는 RPG HUB</title>

    <meta property="og:title" content="제목 없는 알피지 허브">
    <meta property="og:description" content="로블록스 제목 없는 알피지 허브 여러가지 사이트가 담겨있다.">
    <meta property="og:type" content="website">
    <meta property="theme-color" content="#00bcd4">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030205;
            color: #ffffff;
        }

        /* 배경 캔버스 */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 상단 검은 NPC 연출 영역 */
        .npc-character-container {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 420px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .npc-character-container.fade-out {
            opacity: 0;
        }

        #npcCanvas {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.95));
        }

        /* 게임 UI 메인 레이어 */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 24px;
            pointer-events: none;
        }

        /* 디스코드 스타일 임베드 카드 */
        .embed-card {
            width: 100%;
            max-width: 950px;
            background: #2f3136;
            border-left: 4px solid #00bcd4;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 15px;
            pointer-events: auto;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .embed-card.visible {
            display: flex;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .embed-site-name {
            font-size: 0.85rem;
            color: #b9bbbe;
            font-weight: 500;
        }

        .embed-title {
            font-size: 1.15rem;
            color: #00bcd4;
            font-weight: 700;
            text-decoration: none;
        }

        .embed-description {
            font-size: 0.95rem;
            color: #dcddde;
            line-height: 1.4;
        }

        .embed-thumbnail {
            width: 52px;
            height: 52px;
            background-color: #121316;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
            border: 1px solid rgba(0, 188, 212, 0.3);
        }

        .shield-icon {
            width: 32px;
            height: 32px;
            fill: #00bcd4;
            filter: drop-shadow(0 0 6px rgba(0, 188, 212, 0.6));
        }

        /* 선택지 박스 영역 */
        .choices-container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .choices-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(22, 16, 35, 0.94), rgba(10, 7, 18, 0.97));
            border: 2px solid #5a447c;
            border-radius: 12px;
            color: #f0ebfa;
            padding: 16px 24px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: -0.3px;
            -webkit-tap-highlight-color: transparent;
        }

        .choice-btn:hover, .choice-btn:active {
            background: linear-gradient(135deg, rgba(45, 28, 75, 0.98), rgba(20, 12, 38, 0.99));
            border-color: #a87aff;
            color: #ffffff;
            box-shadow: 0 0 22px rgba(168, 122, 255, 0.45);
            transform: translateX(6px);
        }

        .choice-btn::after {
            content: '▶';
            font-size: 0.95rem;
            color: #a87aff;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .choice-btn:hover::after, .choice-btn:active::after {
            opacity: 1;
            transform: translateX(3px);
        }

        /* 메인 대화창 박스 */
        .dialogue-box {
            position: relative;
            width: 100%;
            max-width: 950px;
            min-height: 170px;
            background: linear-gradient(180deg, rgba(22, 19, 26, 0.94) 0%, rgba(12, 10, 15, 0.98) 100%);
            border: 2px solid #d4cfc7;
            border-radius: 16px;
            padding: 26px 32px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.85), 0 10px 35px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            pointer-events: auto;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            gap: 24px;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .portrait-frame {
            position: relative;
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            border-radius: 12px;
            background: #000;
            border: 2px solid rgba(212, 207, 199, 0.4);
            overflow: hidden;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0,0,0,0.8);
        }

        .portrait-canvas {
            width: 100%;
            height: 100%;
        }

        .dialogue-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .npc-name {
            color: #ff6b6b;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 107, 107, 0.4);
            transition: color 0.3s;
        }

        .npc-name.system {
            color: #00bcd4;
            text-shadow: 0 0 8px rgba(0, 188, 212, 0.5);
        }

        .dialogue-text {
            color: #f7f4ee;
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.6;
            min-height: 55px;
            word-break: keep-all;
            white-space: pre-wrap;
            letter-spacing: -0.2px;
        }

        .next-arrow {
            position: absolute;
            right: 26px;
            bottom: 20px;
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 15px solid #ffffff;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
            animation: bounce 0.8s infinite alternate ease-in-out;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .next-arrow.visible {
            opacity: 1;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(6px); }
        }

        #portalCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #portalCanvas.active {
            opacity: 1;
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in;
        }

        .flash-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="npc-character-container" id="npcContainer">
        <canvas id="npcCanvas"></canvas>
    </div>

    <div class="ui-container">
        <!-- 디스코드 스타일 임베드 카드 (시스템 질문 단계에서 등장) -->
        <div class="embed-card" id="embedCard">
            <div class="embed-site-name">제목 없는 알피지 시세 리스트</div>
            <a class="embed-title" href="https://discord-team-dawn.github.io/UNTITLED-RPG-VALUE-LIST/" target="_blank">제목 없는 알피지 시세 리스트</a>
            <div class="embed-description">로블록스 제목 없는 알피지의 아이템 시세표와 거래 계산기</div>
            <div class="embed-thumbnail">
                <svg class="shield-icon" viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.37-2.91 8.44-7 9.5-4.09-1.06-7-5.13-7-9.5v-4.7l7-3.12z"/>
                    <path d="M12 5.5v13c3.42-1.05 6-4.4 6-8.5v-4.5l-6-2z" opacity="0.4"/>
                </svg>
            </div>
        </div>

        <div class="choices-container" id="choicesContainer"></div>

        <div class="dialogue-box" id="dialogueBox">
            <div class="portrait-frame">
                <canvas id="portraitCanvas" class="portrait-canvas"></canvas>
            </div>
            <div class="dialogue-content">
                <div class="npc-name" id="npcName">???</div>
                <div class="dialogue-text" id="dialogueText"></div>
            </div>
            <div class="next-arrow" id="nextArrow"></div>
        </div>
    </div>

    <canvas id="portalCanvas"></canvas>
    <div class="flash-overlay" id="flashOverlay"></div>

    <script>
        const dialogueTree = {
            start: {
                npc: "???",
                text: "음.. 아무래도 길을 찾고 있는 것 같구나. 네가 가고 싶은 곳은 어디지?",
                choices: [
                    { text: "미정", next: "confirm_undefined" },
                    { text: "시세표를 보러 갈래", next: "say_market" }
                ]
            },
            // [시세표] 선택 1단계: NPC 대사 출력
            say_market: {
                npc: "???",
                text: "그래, 시세표를 보고 꼭 거래를 잘하거라.",
                autoNextDelay: 1500, // 대사 끝난 뒤 사라지는 연출 타이머
                next: "system_market_question"
            },
            // [시세표] 선택 2단계: NPC 사라짐 + 임베드 카드 등장 + 시스템 질문
            system_market_question: {
                npc: "[ 시스템 ]",
                isSystem: true,
                hideNpcModel: true,
                showEmbed: true,
                text: "이 포탈로 이동하시겠습니까?",
                choices: [
                    { text: "입장", action: "enter_market" },
                    { text: "취소", next: "start" }
                ]
            },
            // [미정] 선택
            confirm_undefined: {
                npc: "???",
                text: "아직 이곳은 정해지지 않았단다. 이 포탈로 이동하시겠습니까?",
                choices: [
                    { text: "입장", action: "enter_undefined" },
                    { text: "취소", next: "start" }
                ]
            }
        };

        let currentStep = "start";
        let isTyping = false;
        let typingTimeout = null;
        let autoNextTimeout = null;
        let fullText = "";
        let textIndex = 0;
        let isPortalRunning = false;

        const dialogueTextEl = document.getElementById('dialogueText');
        const npcNameEl = document.getElementById('npcName');
        const choicesContainerEl = document.getElementById('choicesContainer');
        const nextArrowEl = document.getElementById('nextArrow');
        const dialogueBox = document.getElementById('dialogueBox');
        const flashOverlay = document.getElementById('flashOverlay');
        const portalCanvas = document.getElementById('portalCanvas');
        const embedCard = document.getElementById('embedCard');
        const npcContainer = document.getElementById('npcContainer');

        function startDialogue(stepKey) {
            currentStep = stepKey;
            const data = dialogueTree[stepKey];
            
            clearTimeout(autoNextTimeout);

            npcNameEl.innerText = data.npc;
            if (data.isSystem) {
                npcNameEl.classList.add('system');
            } else {
                npcNameEl.classList.remove('system');
            }

            // 상단 NPC 사라짐/나타남 연출
            if (data.hideNpcModel) {
                npcContainer.classList.add('fade-out');
            } else {
                npcContainer.classList.remove('fade-out');
            }

            // 임베드 카드 표시
            if (data.showEmbed) {
                embedCard.classList.add('visible');
            } else {
                embedCard.classList.remove('visible');
            }

            fullText = data.text;
            textIndex = 0;
            dialogueTextEl.innerText = "";
            choicesContainerEl.classList.remove('visible');
            choicesContainerEl.innerHTML = "";
            nextArrowEl.classList.remove('visible');

            isTyping = true;
            typeNextChar();
        }

        function typeNextChar() {
            if (textIndex < fullText.length) {
                dialogueTextEl.innerText += fullText.charAt(textIndex);
                textIndex++;
                typingTimeout = setTimeout(typeNextChar, 60);
            } else {
                completeTyping();
            }
        }

        function completeTyping() {
            clearTimeout(typingTimeout);
            dialogueTextEl.innerText = fullText;
            isTyping = false;

            const data = dialogueTree[currentStep];

            if (data.choices) {
                nextArrowEl.classList.add('visible');
                showChoices(data.choices);
            } else if (data.autoNextDelay && data.next) {
                // 대사 출력이 완료되고 몇 초 후에 자동으로 다음 연출(시스템 질문)로 이동
                autoNextTimeout = setTimeout(() => {
                    startDialogue(data.next);
                }, data.autoNextDelay);
            }
        }

        function showChoices(choices) {
            choicesContainerEl.innerHTML = "";
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                
                const handleChoiceAction = (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    embedCard.classList.remove('visible');

                    if (choice.action === "enter_undefined") {
                        triggerPortalSequence(null, true);
                    } else if (choice.action === "enter_market") {
                        triggerPortalSequence("https://discord-team-dawn.github.io/UNTITLED-RPG-VALUE-LIST/");
                    } else if (choice.next) {
                        startDialogue(choice.next);
                    }
                };

                btn.addEventListener('click', handleChoiceAction);
                btn.addEventListener('touchend', handleChoiceAction);

                choicesContainerEl.appendChild(btn);
            });
            choicesContainerEl.classList.add('visible');
        }

        const handleDialogueBoxInteraction = (e) => {
            if (isPortalRunning) return;
            if (isTyping) {
                completeTyping();
            } else {
                const data = dialogueTree[currentStep];
                if (data.autoNextDelay && data.next) {
                    clearTimeout(autoNextTimeout);
                    startDialogue(data.next);
                }
            }
        };

        dialogueBox.addEventListener('click', handleDialogueBoxInteraction);
        dialogueBox.addEventListener('touchend', (e) => {
            e.preventDefault();
            handleDialogueBoxInteraction(e);
        });

        // 배경 애니메이션
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgParticles = [];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        for (let i = 0; i < 45; i++) {
            bgParticles.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 2.2 + 1,
                speedY: -(Math.random() * 0.7 + 0.2),
                opacity: Math.random()
            });
        }

        function renderBg() {
            bgCtx.fillStyle = '#030206';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgCtx.strokeStyle = 'rgba(80, 60, 110, 0.1)';
            bgCtx.lineWidth = 1;
            const gridGap = 70;
            for (let x = 0; x < bgCanvas.width; x += gridGap) {
                bgCtx.beginPath();
                bgCtx.moveTo(x, 0);
                bgCtx.lineTo(x, bgCanvas.height);
                bgCtx.stroke();
            }
            for (let y = 0; y < bgCanvas.height; y += gridGap) {
                bgCtx.beginPath();
                bgCtx.moveTo(0, y);
                bgCtx.lineTo(bgCanvas.width, y);
                bgCtx.stroke();
            }

            const grad = bgCtx.createRadialGradient(bgCanvas.width / 2, bgCanvas.height / 2, 50, bgCanvas.width / 2, bgCanvas.height / 2, bgCanvas.width * 0.7);
            grad.addColorStop(0, 'rgba(50, 25, 80, 0.35)');
            grad.addColorStop(1, 'rgba(3, 2, 6, 0.98)');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgCtx.fillStyle = 'rgba(183, 148, 255, 0.6)';
            bgParticles.forEach(p => {
                p.y += p.speedY;
                if (p.y < 0) p.y = bgCanvas.height;
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                bgCtx.fill();
            });

            requestAnimationFrame(renderBg);
        }
        renderBg();

        // 상단 NPC 연출
        const npcCanvas = document.getElementById('npcCanvas');
        const nCtx = npcCanvas.getContext('2d');
        npcCanvas.width = 380;
        npcCanvas.height = 420;

        let npcTick = 0;

        function renderNpc() {
            nCtx.clearRect(0, 0, 380, 420);
            npcTick += 0.03;

            const cx = 190;
            const cy = 210;

            nCtx.save();
            nCtx.translate(cx, cy);
            for (let i = 0; i < 8; i++) {
                const angle = npcTick * 0.8 + (i * Math.PI / 4);
                const rx = Math.sin(angle) * 20;
                const ry = Math.cos(angle * 1.2) * 15;

                const auraGrad = nCtx.createRadialGradient(rx, ry, 12, rx, ry, 95);
                auraGrad.addColorStop(0, 'rgba(30, 10, 50, 0.9)');
                auraGrad.addColorStop(0.5, 'rgba(120, 25, 180, 0.3)');
                auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                nCtx.fillStyle = auraGrad;
                nCtx.beginPath();
                nCtx.arc(rx, ry, 95, 0, Math.PI * 2);
                nCtx.fill();
            }
            nCtx.restore();

            nCtx.save();
            nCtx.fillStyle = '#06040a';
            nCtx.beginPath();
            nCtx.moveTo(70, 410);
            nCtx.quadraticCurveTo(cx, 230, 310, 410);
            nCtx.fill();

            nCtx.fillStyle = '#0b0812';
            nCtx.beginPath();
            nCtx.moveTo(cx, 100);
            nCtx.quadraticCurveTo(cx + 70, 130, cx + 65, 220);
            nCtx.quadraticCurveTo(cx, 250, cx - 65, 220);
            nCtx.quadraticCurveTo(cx - 70, 130, cx, 100);
            nCtx.fill();

            nCtx.fillStyle = '#000000';
            nCtx.beginPath();
            nCtx.arc(cx, 175, 52, 0, Math.PI * 2);
            nCtx.fill();

            const eyeGlow = Math.abs(Math.sin(npcTick * 2)) * 0.4 + 0.6;
            nCtx.fillStyle = `rgba(255, 40, 80, ${eyeGlow})`;
            nCtx.shadowColor = '#ff1a4b';
            nCtx.shadowBlur = 15;

            nCtx.beginPath();
            nCtx.ellipse(cx - 18, 170, 5, 2.2, -0.2, 0, Math.PI * 2);
            nCtx.ellipse(cx + 18, 170, 5, 2.2, 0.2, 0, Math.PI * 2);
            nCtx.fill();

            nCtx.restore();

            requestAnimationFrame(renderNpc);
        }
        renderNpc();

        // 초상화 Canvas
        const portraitCanvas = document.getElementById('portraitCanvas');
        const pCtx = portraitCanvas.getContext('2d');
        portraitCanvas.width = 100;
        portraitCanvas.height = 100;

        let auraAngle = 0;
        function renderPortrait() {
            pCtx.fillStyle = '#000000';
            pCtx.fillRect(0, 0, 100, 100);

            auraAngle += 0.04;
            pCtx.save();
            pCtx.translate(50, 50);
            
            for (let i = 0; i < 6; i++) {
                pCtx.rotate(auraAngle + i);
                const pGrad = pCtx.createRadialGradient(0, 0, 6, 0, 0, 45);
                pGrad.addColorStop(0, 'rgba(150, 40, 240, 0.85)');
                pGrad.addColorStop(0.5, 'rgba(30, 0, 60, 0.5)');
                pGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                pCtx.fillStyle = pGrad;
                pCtx.fillRect(-45, -45, 90, 90);
            }
            pCtx.restore();

            requestAnimationFrame(renderPortrait);
        }
        renderPortrait();

        // 회전 포탈 & 하얀 빛 연출
        const portalCtx = portalCanvas.getContext('2d');

        function resizePortal() {
            portalCanvas.width = window.innerWidth;
            portalCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizePortal);
        resizePortal();

        function triggerPortalSequence(targetUrl, isReload = false) {
            if (isPortalRunning) return;
            isPortalRunning = true;
            portalCanvas.classList.add('active');

            let scale = 0;
            let rotation = 0;
            let speed = 0.06;
            let maxScale = Math.max(portalCanvas.width, portalCanvas.height) / 60;

            function animatePortal() {
                portalCtx.clearRect(0, 0, portalCanvas.width, portalCanvas.height);

                const cx = portalCanvas.width / 2;
                const cy = portalCanvas.height / 2;

                scale += (maxScale - scale) * 0.035 + 0.08;
                rotation += speed;
                speed += 0.004;

                portalCtx.save();
                portalCtx.translate(cx, cy);
                portalCtx.rotate(rotation);
                portalCtx.scale(scale, scale);

                for (let i = 0; i < 12; i++) {
                    portalCtx.rotate((Math.PI * 2) / 12);
                    const pGrad = portalCtx.createRadialGradient(0, 0, 2, 25, 25, 50);
                    pGrad.addColorStop(0, 'rgba(255, 60, 100, 0.9)');
                    pGrad.addColorStop(0.4, 'rgba(180, 20, 220, 0.7)');
                    pGrad.addColorStop(0.8, 'rgba(80, 0, 150, 0.3)');
                    pGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                    portalCtx.fillStyle = pGrad;
                    portalCtx.beginPath();
                    portalCtx.arc(20, 0, 30, 0, Math.PI * 2);
                    portalCtx.fill();
                }

                const coreGrad = portalCtx.createRadialGradient(0, 0, 0, 0, 0, 25);
                coreGrad.addColorStop(0, '#ffffff');
                coreGrad.addColorStop(0.5, '#ff4b8b');
                coreGrad.addColorStop(1, 'rgba(147, 0, 255, 0)');
                portalCtx.fillStyle = coreGrad;
                portalCtx.beginPath();
                portalCtx.arc(0, 0, 25, 0, Math.PI * 2);
                portalCtx.fill();

                portalCtx.restore();

                if (scale < maxScale) {
                    requestAnimationFrame(animatePortal);
                } else {
                    flashOverlay.classList.add('active');
                    setTimeout(() => {
                        if (isReload) {
                            window.location.reload();
                        } else if (targetUrl) {
                            window.location.href = targetUrl;
                        }
                    }, 800);
                }
            }

            animatePortal();
        }

        // 실행 시작
        startDialogue('start');
    </script>
</body>
</html>
