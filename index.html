<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제목 없는 RPG HUB</title>

    <!-- 디스코드 / 카카오톡 링크 공유용 메타태그 (임베드 설정) -->
    <meta property="og:title" content="제목 없는 알피지 허브">
    <meta property="og:description" content="로블록스 제목 없는 알피지 허브 여러가지 사이트가 담겨있다.">
    <meta property="og:type" content="website">
    <meta property="theme-color" content="#00bcd4">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030205;
            color: #ffffff;
        }

        /* 배경 캔버스 */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 상단 검은 NPC 연출 영역 */
        .npc-character-container {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 420px;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #npcCanvas {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.95));
        }

        /* 게임 UI 메인 레이어 */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 24px;
            pointer-events: none;
        }

        /* 디스코드 스타일 임베드 카드 */
        .embed-card {
            width: 100%;
            max-width: 950px;
            background: #2f3136;
            border-left: 4px solid #00bcd4;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 15px;
            pointer-events: auto;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .embed-card.visible {
            display: flex;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .embed-site-name {
            font-size: 0.85rem;
            color: #b9bbbe;
            font-weight: 500;
        }

        .embed-title {
            font-size: 1.15rem;
            color: #00bcd4;
            font-weight: 700;
            text-decoration: none;
        }
